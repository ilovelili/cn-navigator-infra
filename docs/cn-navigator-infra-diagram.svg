<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans JP", sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .section { font-size: 18px; font-weight: 700; fill: #334155; }
      .node-title { font-size: 20px; font-weight: 700; }
      .node-sub { font-size: 15px; fill: #475569; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 13px; fill: #64748b; }
      .flow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .manage { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="62" class="title">CN Navigator インフラ構成図</text>
  <text x="70" y="94" class="subtitle">静的WebアプリをCloudFront経由で配信し、認証はAuth0、業務データはSupabaseを利用</text>

  <!-- Client -->
  <rect x="70" y="205" rx="20" ry="20" width="260" height="200" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="205" rx="20" ry="20" width="260" height="48" fill="#e2e8f0"/>
  <text x="200" y="236" text-anchor="middle" class="section">利用者端末</text>
  <circle cx="135" cy="304" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="135" cy="294" r="8" fill="#2563eb"/>
  <path d="M116 324 Q135 305 154 324" fill="#2563eb"/>
  <text x="185" y="298" class="node-title">Webブラウザー</text>
  <text x="185" y="323" class="node-sub">管理者・担当者・荷主</text>
  <text x="200" y="370" text-anchor="middle" class="small">React + TypeScript + Vite SPA</text>

  <!-- AWS boundary -->
  <rect x="430" y="145" rx="26" ry="26" width="640" height="390" fill="#fffaf0" stroke="#f59e0b" stroke-width="3"/>
  <rect x="430" y="145" rx="26" ry="26" width="640" height="55" fill="#fef3c7"/>
  <text x="465" y="180" class="section">AWS Account：CN Logistics所有</text>
  <text x="1035" y="180" text-anchor="end" class="small">S3: ap-northeast-1 / CloudFront: Global</text>

  <!-- CloudFront -->
  <rect x="490" y="250" rx="18" ry="18" width="230" height="180" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="605" cy="295" r="28" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <path d="M583 294 H627 M605 272 V318 M588 280 Q605 295 622 310 M622 280 Q605 295 588 310" stroke="#ea580c" stroke-width="2" fill="none"/>
  <text x="605" y="346" text-anchor="middle" class="node-title">Amazon CloudFront</text>
  <text x="605" y="372" text-anchor="middle" class="node-sub">HTTPS CDN・圧縮・キャッシュ</text>
  <text x="605" y="397" text-anchor="middle" class="node-sub">403/404 → index.html（SPA）</text>

  <!-- S3 -->
  <rect x="800" y="250" rx="18" ry="18" width="220" height="180" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <ellipse cx="910" cy="284" rx="32" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <path d="M878 284 V320 C878 336 942 336 942 320 V284" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="910" cy="320" rx="32" ry="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="910" y="360" text-anchor="middle" class="node-title">Private S3 Bucket</text>
  <text x="910" y="385" text-anchor="middle" class="node-sub">dist / 静的ビルド成果物</text>
  <text x="910" y="410" text-anchor="middle" class="node-sub">Public access block：ON</text>

  <!-- OAC -->
  <line x1="720" y1="340" x2="800" y2="340" class="flow"/>
  <rect x="730" y="292" rx="10" ry="10" width="60" height="34" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="760" y="314" text-anchor="middle" class="small" font-weight="700">OAC</text>
  <text x="760" y="371" text-anchor="middle" class="tiny">SigV4署名</text>
  <text x="760" y="391" text-anchor="middle" class="tiny">S3読取のみ</text>

  <!-- User to CDN -->
  <line x1="330" y1="305" x2="490" y2="305" class="flow-blue"/>
  <text x="410" y="287" text-anchor="middle" class="small">HTTPS</text>
  <text x="410" y="329" text-anchor="middle" class="tiny">Webアプリ配信</text>

  <!-- SaaS services -->
  <rect x="1130" y="165" rx="18" ry="18" width="220" height="150" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="1175" cy="218" r="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <path d="M1164 219 l8 8 16 -19" stroke="#7c3aed" stroke-width="4" fill="none"/>
  <text x="1238" y="215" class="node-title">Auth0</text>
  <text x="1238" y="240" class="node-sub">ユーザー認証</text>
  <text x="1240" y="278" text-anchor="middle" class="small">Login / Logout / ID Token</text>

  <rect x="1130" y="365" rx="18" ry="18" width="220" height="190" fill="#ffffff" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="1175" cy="420" r="24" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <path d="M1161 412 H1189 M1161 420 H1189 M1161 428 H1189" stroke="#059669" stroke-width="3"/>
  <text x="1238" y="416" class="node-title">Supabase</text>
  <text x="1238" y="441" class="node-sub">業務データ基盤</text>
  <text x="1240" y="479" text-anchor="middle" class="small">Postgres / RPC / Storage</text>
  <text x="1240" y="504" text-anchor="middle" class="small">RLS・権限別データ制御</text>
  <text x="1240" y="529" text-anchor="middle" class="tiny">AWS外の既存マネージドサービス</text>

  <!-- Browser to SaaS flows -->
  <path d="M330 265 C690 80 970 80 1130 220" class="flow"/>
  <text x="760" y="120" text-anchor="middle" class="small">認証リダイレクト・ID Token</text>
  <path d="M330 360 C650 620 960 610 1130 470" class="flow"/>
  <text x="735" y="585" text-anchor="middle" class="small">HTTPS API：RPC・DB・ファイル操作</text>
  <text x="735" y="608" text-anchor="middle" class="tiny">Auth0 ID Tokenを使用</text>

  <!-- Provisioning / operations -->
  <rect x="160" y="685" rx="20" ry="20" width="1080" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="200" y="724" class="section">構築・変更の実施方法（どちらかを選択）</text>

  <rect x="205" y="750" rx="12" ry="12" width="330" height="58" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="370" y="775" text-anchor="middle" class="node-title">A案：CN Logistics IT</text>
  <text x="370" y="798" text-anchor="middle" class="node-sub">AWSコンソールで手作業構築</text>

  <rect x="605" y="750" rx="12" ry="12" width="360" height="58" fill="#eff6ff" stroke="#2563eb"/>
  <text x="785" y="775" text-anchor="middle" class="node-title">B案：Min + Pulumi</text>
  <text x="785" y="798" text-anchor="middle" class="node-sub">期限付き最小権限でコードから構築</text>

  <rect x="1010" y="750" rx="12" ry="12" width="185" height="58" fill="#ecfdf5" stroke="#059669"/>
  <text x="1102" y="775" text-anchor="middle" class="node-title">最終所有者</text>
  <text x="1102" y="798" text-anchor="middle" class="node-sub">CN Logistics</text>

  <path d="M535 779 H605" class="manage"/>
  <path d="M965 779 H1010" class="manage"/>
  <path d="M785 750 C785 675 760 645 750 535" class="manage"/>

  <text x="700" y="875" text-anchor="middle" class="tiny">機密情報（AWSキー、パスワード、環境変数）はTrello・メール・GitHubへ記載しない</text>
</svg>
